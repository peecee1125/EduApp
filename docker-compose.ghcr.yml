# Use this on the NAS after GitHub Actions has pushed the image to GHCR.
# Set GHCR_OWNER to the GitHub repository owner in the shell or Portainer stack.

services:
  math-quiz:
    image: "ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER to the GitHub repository owner}/eduapp-math-quiz:latest"
    restart: unless-stopped
    ports:
      - "9080:80"
